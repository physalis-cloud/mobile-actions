name: Physalis — materiel de signature mobile
description: >
  Recupere le materiel de signature d'une app (iOS ou Android) aupres de
  Physalis par OIDC, le verifie avant tout build, et sert le numero de build.
  Aucun secret GitHub.
author: Physalis

inputs:
  app:
    description: bundleId (iOS) ou applicationId (Android) de l'app declaree dans Physalis
    required: true
  platform:
    description: Plateforme attendue (ios | android). Un bundle d'une autre plateforme fait echouer.
    required: true
  signing:
    description: >
      iOS seulement. `manual` (defaut) : certificat .p12 + profil detenus par
      Physalis, signature par ios-release. `automatic` : seule la cle d'API App
      Store Connect (et le Team ID de l'app) est servie ; Xcode cree lui-meme
      certificat et profils (`xcodebuild -allowProvisioningUpdates`), ce qui
      couvre les apps a extensions (un profil par cible). Le build et l'envoi
      sont alors a la charge du workflow, pas d'ios-release.
    required: false
    default: manual
  physalis-url:
    description: URL de l'instance Physalis
    required: false
    default: https://vault.physalis.cloud
  audience:
    description: Audience OIDC attendue par l'instance (defaut = hote de physalis-url)
    required: false
    default: ""

outputs:
  build-number:
    description: Numero de build servi par Physalis (CFBundleVersion / versionCode)
    value: ${{ steps.fetch.outputs.build-number }}
  version-name:
    description: Version marketing fixee dans Physalis (peut etre vide)
    value: ${{ steps.fetch.outputs.version-name }}

runs:
  using: composite
  steps:
    - id: fetch
      shell: bash
      env:
        PHYSALIS_URL: ${{ inputs.physalis-url }}
        PHYSALIS_AUDIENCE_IN: ${{ inputs.audience }}
        IN_APP: ${{ inputs.app }}
        IN_PLATFORM: ${{ inputs.platform }}
        IN_SIGNING: ${{ inputs.signing }}
      run: bash "$GITHUB_ACTION_PATH/fetch.sh"
